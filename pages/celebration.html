<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 12th Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/gifts.css">
<link rel="stylesheet" href="../css/extras.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="memories.html">Back to the memories</a>
  <h1>
    <span class="given">Happy 12th birthday</span>
    <span class="main">Gabriella</span>
  </h1>
  <p class="fullname">Wamai Gabriella Powers</p>

  <svg class="cake" id="cake" viewBox="0 0 240 190" aria-hidden="true">
    <rect class="plate" x="5" y="180" width="230" height="8" rx="4"/>
    <rect class="tier tier1" x="20" y="130" width="200" height="50"/>
    <path class="band" d="M20 150 H220"/>
    <rect class="tier tier2" x="45" y="95" width="150" height="38"/>
    <rect class="tier tier3" x="70" y="60" width="100" height="38"/>
    <g id="candles"></g>
  </svg>

  <button class="btn" id="wishBtn" type="button">Make a wish</button>

  <section id="after" hidden>
    <p class="closing">May this year be your best yet. Your kingdom will always be here for you.</p>
    <a class="next-link" href="../index.html">Visit the castle again</a>
  </section>
</main>
<script src="../js/celebration.js"></script>
</body>
</html>
