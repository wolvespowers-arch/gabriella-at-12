<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wamai Gabriella Powers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main class="page">
  <div class="moon" aria-hidden="true"></div>

  <section class="arch">
    <p class="invite">You are invited to a kingdom of your own</p>
    <h1>
      <span class="given">Wamai</span>
      <span class="main">Gabriella</span>
      <span class="given">Powers</span>

    <p class="turns">turns</p>
    <p class="twelve">12</p>
    <p class="when" id="when"></p>
    <button class="enter" id="enterBtn" type="button">Enter the castle</button>
  </section>

  <svg class="castle" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <rect x="0" y="120" width="400" height="40"/>
    <rect x="150" y="70" width="100" height="90"/>
    <polygon points="140,70 200,20 260,70"/>
    <rect x="60" y="85" width="40" height="75"/>
    <polygon points="52,85 80,45 108,85"/>
    <rect x="300" y="85" width="40" height="75"/>
    <polygon points="292,85 320,45 348,85"/>
    <rect x="10" y="105" width="30" height="55"/>
    <polygon points="5,105 25,78 45,105"/>
    <rect x="360" y="105" width="30" height="55"/>
    <polygon points="355,105 375,78 395,105"/>
    <rect x="199" y="6" width="2" height="16"/>
    <polygon class="gold" points="201,6 219,11 201,16"/>
    <rect class="gold" x="195" y="90" width="10" height="18" rx="5"/>
    <rect class="gold" x="72" y="105" width="8" height="15" rx="4"/>
    <rect class="gold" x="320" y="105" width="8" height="15" rx="4"/>
    <rect class="gold" x="17" y="125" width="6" height="12" rx="3"/>
    <rect class="gold" x="377" y="125" width="6" height="12" rx="3"/>
    <path class="door" d="M188 160 V138 a12 12 0 0 1 24 0 V160 Z"/>
  </svg>
</main>
<script src="js/main.js"></script>
</body>
</html>
